name: CI
on:
  pull_request:
  push: { branches: [main] }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Every route in the sitemap was prerendered
        run: |
          for loc in $(grep -o '<loc>[^<]*' dist/sitemap.xml | sed 's|<loc>https://kohqingjia.io||'); do
            test -f "dist${loc%/}/index.html" || { echo "missing prerendered page for $loc"; exit 1; }
          done
      - name: JS budget (gzip < 160 KB)
        run: |
          size=$(cat dist/assets/*.js | gzip -c | wc -c)
          echo "js gzip bytes: $size"; test "$size" -lt 163840
