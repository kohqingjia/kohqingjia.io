<!doctype html>
<html lang="en-GB" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#020617" />
    <title>Koh Qing Jia</title>
    <script>
      // Apply the saved theme before first paint (default: dark). See src/lib/theme.ts.
      try {
        if (localStorage.getItem('theme') === 'light') {
          document.documentElement.classList.remove('dark');
          document.documentElement.style.colorScheme = 'light';
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#ffffff');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="font-family: system-ui; padding: 24px">
        Koh Qing Jia, Information Systems student at SMU. This site needs JavaScript.
        <a href="/cv">Résumé (PDF)</a> · <a href="https://github.com/kohqingjia">GitHub</a> ·
        <a href="https://www.linkedin.com/in/kohqingjia/">LinkedIn</a>
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
